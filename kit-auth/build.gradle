plugins {
	id 'java-library'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.vanniktech.maven.publish' version '0.37.0'
}

group = 'io.github.si-u-gi'
version = '1.0.1'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencyManagement {
	imports {
		mavenBom 'org.springframework.boot:spring-boot-dependencies:4.0.8'
	}
}

dependencies {
	api 'org.springframework.boot:spring-boot-starter-web'
	api 'org.springframework.boot:spring-boot-starter-security'

	api 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

mavenPublishing {
	coordinates('io.github.si-u-gi', 'kit-auth', '1.0.1')

	publishToMavenCentral()
	signAllPublications()

	pom {
		name = 'kit-auth'
		description = 'Reusable authentication library for Spring Boot applications'
		url = 'https://github.com/si-u-gi/backend-kit'

		licenses {
			license {
				name = 'The MIT License'
				url = 'https://opensource.org/licenses/MIT'
			}
		}

		developers {
			developer {
				id = 'si-u-gi'
				name = 'si-u-gi'
			}
		}

		scm {
			url = 'https://github.com/si-u-gi/backend-kit'
			connection = 'scm:git:git://github.com/si-u-gi/backend-kit.git'
			developerConnection = 'scm:git:ssh://github.com/si-u-gi/backend-kit.git'
		}
	}
}

signing {
	useGpgCmd()
}

tasks.withType(Sign).configureEach {
	enabled = false
}